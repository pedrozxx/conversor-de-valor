<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Conversor de moedas — Dólar, Euro e Libra</title>
    <meta name="description" content="Conversor de moedas com cotação real via API e cache de 24h. Converte entre Real, Dólar, Euro e Libra. Feito em JavaScript puro por Pedro Augusto Darolt." />
    <meta name="author" content="Pedro Augusto Darolt" />
    <link rel="canonical" href="https://conversor-de-valor.vercel.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:url" content="https://conversor-de-valor.vercel.app/" />
    <meta property="og:title" content="Conversor de moedas — Dólar, Euro e Libra" />
    <meta property="og:description" content="Conversor de moedas com cotação real via API e cache de 24h. Converte entre Real, Dólar, Euro e Libra. Feito em JavaScript puro por Pedro Augusto Darolt." />
    <meta property="og:image" content="https://conversor-de-valor.vercel.app/img/dinheiro.png" />
    <meta name="twitter:card" content="summary_large_image" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="shortcut icon" href="./img/dinheiro.png" type="image/x-icon">

<link
href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono&family=Roboto:wght@400;500;700&display=swap"
rel="stylesheet"
/>

<link rel="stylesheet" href="styles.css" />

</head>
<body>
<img src="./img/logo.svg" alt="Convert logo" />

<main>
<form id="form">
<label for="amount">valor</label>
<input type="text" name="amount" id="amount" inputmode="decimal" placeholder="Ex.: 1250,50" title="Valor positivo com até duas casas decimais, sem separador de milhar" required />

<label for="currency">moeda</label>
<select name="currency" id="currency" required>
<option value="" disabled selected hidden>Selecione a moeda</option>
<option value="USD">Dólar Americano para Real</option>
<option value="EUR">Euro para Real</option>
<option value="GBP">Libra Esterlina para Real</option>
<option value="BRL-USD">Real para Dólar Americano</option>
<option value="BRL-EUR">Real para Euro</option>
<option value="BRL-GBP">Real para Libra Esterlina</option>
</select>

<button type="submit">Converter</button>
</form>

<footer>
<span id="description">Selecione uma moeda</span>
<h1 id="result">0</h1>
</footer>
</main>

<script src="script.js"></script>
</body>
</html>
